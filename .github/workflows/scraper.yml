name: Automated Impact Scraper Pipeline

on:
  schedule:
    # Runs once a week automatically (Every Sunday at 00:00 UTC)
    - cron: '0 0 * * 0'
  # Allows manual one-click trigger from GitHub Actions tab anytime
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies & Playwright Browsers
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests beautifulsoup4 gspread google-auth python-dotenv firebase-admin
          playwright install chromium --with-deps

      # Google Sheets sync reads google-service-account.json from the repository root.
      # The key comes from a GitHub secret via an environment variable and is never printed.
      - name: Create Google Sheets credentials file
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$GOOGLE_SHEETS_SERVICE_ACCOUNT_KEY" ]; then
            echo "GOOGLE_SHEETS_SERVICE_ACCOUNT_KEY is not set; Google Sheets sync will run in offline mode."
          else
            umask 077
            printf '%s' "$GOOGLE_SHEETS_SERVICE_ACCOUNT_KEY" > google-service-account.json
            chmod 600 google-service-account.json
            echo "Google Sheets credentials file created."
          fi

      - name: Execute Live Scraper Pipeline
        id: scraper
        env:
          MANAGEMENT_PORTAL_URL: ${{ secrets.MANAGEMENT_PORTAL_URL }}
          MANAGEMENT_PORTAL_EMAIL: ${{ secrets.MANAGEMENT_PORTAL_EMAIL }}
          MANAGEMENT_PORTAL_PASSWORD: ${{ secrets.MANAGEMENT_PORTAL_PASSWORD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          # TEST Firebase project only. The safety guard in firebase_sync.py also enforces an allow-list.
          FIREBASE_EXPECTED_PROJECT_ID: ${{ vars.FIREBASE_EXPECTED_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_TEST_SERVICE_ACCOUNT_KEY }}
        run: |
          python src/scripts/agents/pipeline.py

      # Always runs, even if the pipeline step fails: remove the temporary credentials file
      - name: Remove Google Sheets credentials file
        if: always()
        run: rm -f google-service-account.json

      # Always runs — shows all files created during the run for extra visibility
      - name: List Generated Files (Debug)
        if: always()
        run: |
          echo "=== Files in root directory ==="
          ls -la *.png *.json *.html 2>/dev/null || echo "No debug files found in root"
          echo "=== Scraper Data Store ==="
          cat src/data/liveImpactStore.json 2>/dev/null || echo "liveImpactStore.json not found"
